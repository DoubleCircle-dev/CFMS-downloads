/* 左侧聊天列表 */

}
.room-list {
    flex: 1;

}
.room-item {

}
.room-item:hover { background: #dadada; }
.room-item.active { background: #c9c9c9; }
.room-avatar {

    border-radius: 6px;
    background: #07c160;
    color: #fff;

.room-info { flex: 1; min-width: 0; }
.room-name {

    margin-bottom: 4px;

}
.room-meta {

}

    text-align: center;

    flex-direction: column;
    background: #f5f5f5;
    min-width: 0;
}
.chat-header {
    padding: 14px 20px;
    background: #ededed;
    border-bottom: 1px solid #d9d9d9;
    display: flex;
    align-items: center;
}
.chat-header .title {
    font-size: 17px;
    font-weight: 500;
    color: #191919;
}
.chat-header .sub-info {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
}
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* 时间分隔线 */
.time-divider {
    text-align: center;
    margin: 16px 0;
}
.time-divider span {
    font-size: 12px;
    color: #b0b0b0;
    background: #f5f5f5;
    padding: 4px 12px;
    border-radius: 2px;
}
.time-divider .date-label {
    display: block;
    font-size: 11px;
    color: #999;
    margin-top: 2px;
}

/* 消息气泡 */
.msg-row {
    display: flex;
    margin-bottom: 16px;
    align-items: flex-start;
}
.msg-row.self {
    flex-direction: row-reverse;
}
.msg-avatar {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;

.msg-row:not(.self) .msg-avatar { margin-right: 10px; }
.msg-bubble-wrap { max-width: 65%; }
.msg-sender {
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
    padding: 0 8px;
}
.msg-row.self .msg-sender { text-align: right; }
.msg-bubble {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    position: relative;
    color: #191919;
}
.msg-row:not(.self) .msg-bubble {
    background: #fff;
    border-top-left-radius: 2px;
}
.msg-row.self .msg-bubble {
    background: #95ec69;
    border-top-right-radius: 2px;
}
.msg-time {
    font-size: 11px;
    color: #b0b0b0;
    margin-top: 4px;
    padding: 0 8px;
}
.msg-row.self .msg-time { text-align: right; }
.msg-ref {
    display: block;
    font-size: 11px;
    color: #888;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid rgba(0,0,0,0.08);
    font-style: italic;

/* 空状态 */
.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ccc;
}
.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state .text { font-size: 16px; }

/* 响应式 */
@media (max-width: 768px) {
    .sidebar { width: 100%; min-width: 0; }
    body { flex-direction: column; }
    .chat-area { display: none; }
    .chat-area.mobile-active { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
}
</style>

var currentRoom = null;
var currentUserId = null;

// 渲染侧边栏
function renderSidebar() {
    var list = document.getElementById('roomList');
    list.innerHTML = '';
    ROOMS.forEach(function(room, index) {
        var div = document.createElement('div');
        div.className = 'room-item' + (currentRoom === room.id ? ' active' : '');
        div.onclick = function() { selectRoom(room.id); };

        var firstMsg = CHATS[room.id] && CHATS[room.id][0];
        var firstUser = firstMsg ? firstMsg.user_name : '未知';

        div.innerHTML =
            '<div class="room-avatar">' + (room.users[0] || '💬')[0] + '</div>' +
            '<div class="room-info">' +
                '<div class="room-name">' + room.name + '</div>' +
                '<div class="room-meta">' + room.users.slice(0, 3).join('、') +
                (room.users.length > 3 ? ' 等' + room.users.length + '人' : '') + '</div>' +
            '</div>' +
            '<div class="room-badge">' + room.message_count + '</div>';
        list.appendChild(div);
    });
}

// 格式化时间
function formatTime(ts) {
    var d = new Date(ts);
    var h = d.getHours().toString().padStart(2, '0');
    var m = d.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
}
function formatDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

// 选择房间
function selectRoom(roomId) {
    currentRoom = roomId;
    var room = ROOMS.find(function(r) { return r.id === roomId; });
    var msgs = CHATS[roomId] || [];

    // 更新头部
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('chatMessages').style.display = 'block';
    document.getElementById('chatTitle').textContent = room.name;
    document.getElementById('chatSubInfo').textContent =
        room.users.join('、') + ' · ' + room.message_count + ' 条消息';

    // 渲染消息
    var container = document.getElementById('chatMessages');
    container.innerHTML = '';

    var lastDate = '';
    // 确定 "自己" 的 ID（默认用第一个用户作为自己）
    var userIds = [];
    msgs.forEach(function(m) {
        if (userIds.indexOf(m.user_id) === -1) userIds.push(m.user_id);
    });
    currentUserId = userIds[0];

    msgs.forEach(function(msg, i) {
        var msgDate = msg.timestamp.split(' ')[0];
        if (msgDate !== lastDate) {
            lastDate = msgDate;
            var dateLabel = DATE_GROUPS[msgDate] || '';
            container.innerHTML +=
                '<div class="time-divider">' +
                    '<span>' + formatDate(msg.timestamp) + '</span>' +
                    (dateLabel ? '<span class="date-label">' + dateLabel + '</span>' : '') +
                '</div>';
        }

        var isSelf = msg.user_id === currentUserId;
        container.innerHTML +=
            '<div class="msg-row' + (isSelf ? ' self' : '') + '">' +
                '<div class="msg-avatar" style="background:' + msg.user_color + '20;color:' + msg.user_color + '">' +
                    msg.user_avatar +
                '</div>' +
                '<div class="msg-bubble-wrap">' +
                    '<div class="msg-sender" style="color:' + msg.user_color + '">' +
                        msg.user_name +
                    '</div>' +
                    '<div class="msg-bubble">' +
                        msg.content +
                    '</div>' +
                    '<div class="msg-time">' + formatTime(msg.timestamp) + '</div>' +
                '</div>' +
            '</div>';
    });

    // 滚动到底部
    container.scrollTop = container.scrollHeight;

    renderSidebar();
}

// 日期标签
var DATE_GROUPS = {"2025-07-20": "系统初搭建", "2025-07-24": "线索推进", "2025-07-27": "ARG深入", "2026-06-20": "音频谜题", "2026-07-18": "时间异常", "2026-07-22": "身份危机", "2026-07-30": "重建计划"};

// 初始化
renderSidebar();
// 默认打开第一个房间
if (ROOMS.length > 0) {
    selectRoom(ROOMS[0].id);
}
</script>
