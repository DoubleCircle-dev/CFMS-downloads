---

description: |
  这是遗闻之钟计划项目组的第 13 次招募，
  旨在于当前时代的时间窗口内寻找和筛选具有一定能力、能够提出新颖设计方案并解决复杂问题的人才。

details: |
  根据决定，本次挑战共设置一个阶段，并在难度设计上按中等偏简单的标准进行，面向当前时代的公众开放。

  在公开发布招募通告后，项目组将采取适当的手段引起公众的注意，以确保有一定数目的人员参与到设计的系列挑战之
  中。称呼实际参与挑战的那一部分人为遗闻之钟的“玩家”，亦或按传统称为“探寻者”。

  由于馆迹消隐律的存在，决定继续复用第 8 - 12 次招募的设计方案，惟应针对当前时代的现状对使用的媒介进行调整。

  对本时代的基本判断如下：
  1. 不存在已普及的量子计算技术；
  2. 不存在已普及的甚高级人工智能技术突破；
  3. 不存在已普及的高性能脑机接口技术；
  4. 不存在已普及的永久/临时性生物学智力增强技术；
  5. 存在一般发达水平的网络基础设施。

  据此，认为第 8 - 12 次招募方案采用的设计理念是适当的。

  招募候选对象由项目组讨论决定。

  本次挑战继续委派给 {$sym:97e148a} 执行，允许其利用遗闻之钟计划项目组对外运营的社媒账户进行活动，
  但应由项目组进行监督和评估。{$sym:97e148a} 的人事档案参见附录 13-01。

